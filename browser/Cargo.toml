[package]
name = "rdfscope-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Browser WebAssembly adapter for the RDFscope engine"
repository = "https://github.com/rvben/rdfscope"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rdfscope = { path = "..", default-features = false, features = ["browser"] }
serde_json = "1"
wasm-bindgen = "0.2"
