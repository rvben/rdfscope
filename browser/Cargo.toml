[package]
name = "rdfscope-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Browser WebAssembly adapter for the RDFscope engine"
repository = "https://github.com/rvben/rdfscope"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxigraph = { version = "=0.5.11", default-features = false, features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "s"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
