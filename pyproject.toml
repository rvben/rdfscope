[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "rdfscope"
dynamic = ["version"]
description = "A local RDF explorer in one binary"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["rdf", "sparql", "graph", "visualization", "linked-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.urls]
Repository = "https://github.com/rvben/rdfscope"
Issues = "https://github.com/rvben/rdfscope/issues"
Changelog = "https://github.com/rvben/rdfscope/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
locked = true
include = [{ path = "web/dist/**", format = "sdist" }]
