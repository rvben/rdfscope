[package]
name = "rdfscope"
version = "0.1.0"
edition = "2024"
description = "A local RDF explorer in one binary"

[[bin]]
name = "rdfscope"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4.6", features = ["derive"] }
oxigraph = { version = "0.5.11", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rust-embed = { version = "8.11", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
webbrowser = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
